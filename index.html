<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122b43">
<meta name="description" content="飲み方や飲み会での立ち回りから、あなたの飲み会人格を16タイプで診断。12問の回答で結果がわかります。">
<title>ABTI｜飲み会人格診断</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122b43'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='46' font-family='serif' fill='%23edbd72'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#122b43;--paper:#fbf7ef;--gold:#a15a21;--line:#dcd6ca;--accent:#8a4a16;--accent-bg:#f0e2d2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.8}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #226aaf;outline-offset:5px}
button:disabled{cursor:default;opacity:.38}
header{max-width:1160px;padding:26px 32px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-family:Georgia,serif;font-size:40px;letter-spacing:-2px;font-weight:900;line-height:1}
.label{font-size:14px;letter-spacing:.1em}
.shell{max-width:1100px;margin:40px auto;padding:0 24px}
.quiz-layout{display:grid;grid-template-columns:300px 1fr;gap:64px;align-items:start}
.intro h1{font-size:34px;line-height:1.5;margin:8px 0 20px;letter-spacing:-.04em}
.intro p{color:#52616e}
.eyebrow{font-size:13px;letter-spacing:.15em;font-weight:700;color:var(--gold);margin:0 0 12px}
.mini-art,.portrait{display:grid;place-items:center;color:var(--accent);background:var(--accent-bg)}
.mini-art{height:230px;width:230px;border-radius:50%;margin-top:28px;border:8px solid white;box-shadow:0 8px 30px #102b4312}
.mini-art svg,.portrait svg{width:58%;height:58%}
.quiz{background:white;padding:38px;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px #14273b06}
.question-meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#596774}
.question-meta strong{color:var(--ink);font-size:20px}
.track{height:5px;background:#ebe7df;border-radius:9px;margin:16px 0 28px;overflow:hidden}
.track span{display:block;height:100%;background:var(--gold);transition:width .2s}
.quiz h2{font-size:25px;line-height:1.6;min-height:80px;margin:0 0 22px}
.answers{display:grid;gap:14px}
.answer{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:20px;color:var(--ink);transition:background .15s,border-color .15s}
.answer:hover{background:#fcf9f3;border-color:#ab8154}
.answer[aria-pressed="true"]{background:#faf0df;border:2px solid var(--gold);padding:19px}
.letter{flex:0 0 30px;width:30px;height:30px;border:1px solid #b9b6ae;border-radius:50%;font-family:Georgia,serif;display:grid;place-items:center;line-height:1}
.answer[aria-pressed="true"] .letter{background:var(--gold);color:white;border-color:var(--gold)}
.navigation{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-top:30px}
.primary{background:var(--ink);border:1px solid var(--ink);color:white;padding:14px 28px;border-radius:9px;font-weight:700}
.primary:hover{background:#244561}
.secondary{background:transparent;color:var(--ink);border:1px solid #aeb7bc;padding:13px 23px;border-radius:9px}
.back{background:transparent;color:#56616b;border:0;padding:10px 4px}
.tip{font-size:13px;color:#717772;margin:18px 0 0}
.result{max-width:970px;margin:auto}
.result-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px}
.result-layout{display:grid;grid-template-columns:390px 1fr;gap:44px;align-items:start}
.result-card{border-radius:18px;background:white;border:1px solid var(--line);overflow:hidden;box-shadow:0 12px 40px #14273b12}
.portrait{aspect-ratio:1}
.card-copy{padding:20px 25px 24px;border-top:5px solid var(--accent)}
.type-code{font-family:Georgia,serif;font-size:53px;line-height:1;color:var(--accent);font-weight:700;letter-spacing:.03em}
.card-copy h2{font-size:24px;line-height:1.5;margin:12px 0 10px;overflow-wrap:anywhere}
.card-copy p{margin:0;font-size:15px;color:#53616c}
.result-copy h3{font-size:24px;margin:0 0 18px;line-height:1.6}
.result-copy p{margin:0 0 22px}
.traits{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tag{font-size:14px;background:color-mix(in srgb, var(--accent) 16%, var(--paper));border-radius:5px;padding:4px 10px}
.axes{margin:28px 0}
.axis{margin:16px 0}
.axis-labels{display:flex;justify-content:space-between;font-size:14px}
.axis-track{display:flex;background:#e4e8ec;height:8px;border-radius:10px;overflow:hidden;margin-top:8px}
.axis-track span{background:var(--accent);display:block}
.axis-left{color:var(--accent);font-weight:700}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.status{font-size:14px;color:#5f6a72;min-height:25px}
.foot{max-width:1100px;margin:38px auto 24px;padding:22px 24px;border-top:1px solid var(--line);color:#647078;font-size:13px}
.foot p{margin:6px 0}
details{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}
summary{cursor:pointer;font-weight:700}
.hidden{display:none!important}
.summary-note{font-size:13px;color:#69767d}
.download-preview{display:block;max-width:420px;width:100%;margin:18px auto;border:1px solid var(--line)}
.name-field{margin-top:22px}
.name-field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.name-field input{width:100%;padding:12px;border:1px solid #b9b6ae;border-radius:9px;background:white;color:var(--ink);font:inherit;font-size:16px}
.name-field input:focus-visible{outline:3px solid #226aaf;outline-offset:3px}
.name-hint{display:block;font-size:12px;color:#647078;margin-top:5px}
.card-copy .person-name{font-size:16px;font-weight:700;margin:0 0 14px;color:var(--ink);overflow-wrap:anywhere}
.type-poster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.type-cell{border-radius:14px;padding:14px 8px 12px;text-align:center;border:1px solid var(--line);background:var(--cell-bg);color:var(--cell-fg);min-width:0}
.type-cell svg{width:56px;height:56px;margin:0 auto 8px;display:block}
.type-cell strong{display:block;font-family:Georgia,serif;font-size:15px;letter-spacing:.04em}
.type-cell span{display:block;font-size:12px;line-height:1.45;margin-top:3px;color:var(--ink);overflow-wrap:anywhere}
.color-rule{font-size:13px;color:#647078;margin-top:16px;line-height:1.75}
.color-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.color-swatch{border-radius:10px;padding:10px 8px;text-align:center;font-size:12px;line-height:1.45;border:1px solid var(--line)}
.color-swatch b{display:block;font-family:Georgia,serif;font-size:14px;margin-bottom:2px}
@media(max-width:850px){
  .quiz-layout{grid-template-columns:220px 1fr;gap:28px}
  .intro h1{font-size:29px}
  .mini-art{width:180px;height:180px}
  .quiz{padding:26px}
  .result-layout{grid-template-columns:minmax(260px,360px) 1fr;gap:28px}
  .type-poster,.color-swatches{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  header{padding:20px}
  .logo{font-size:34px}
  .label{font-size:12px;letter-spacing:.03em}
  .shell{margin:24px auto;padding:0 18px}
  .quiz-layout,.result-layout{grid-template-columns:1fr;gap:22px}
  .intro{position:relative;padding-right:90px}
  .intro h1{font-size:25px;line-height:1.4;margin:3px 0 8px}
  .intro p{font-size:14px;line-height:1.7;margin:0}
  .intro .eyebrow{font-size:12px;margin:0 0 7px}
  .mini-art{position:absolute;right:0;top:14px;width:78px;height:78px;border-width:3px;margin:0}
  .quiz{padding:24px 20px;border-radius:15px}
  .quiz h2{font-size:22px;min-height:unset;margin-bottom:20px}
  .track{margin-bottom:23px}
  .answer{padding:17px 15px;gap:12px}
  .answer[aria-pressed="true"]{padding:16px 14px}
  .primary{padding:13px 21px}
  .result-card{max-width:430px;margin:auto;width:100%}
  .result-copy{padding-top:4px}
  .result-top{margin-bottom:16px}
  .result-top .eyebrow{margin:0}
  .result-copy h3{font-size:22px}
  .actions>*{flex:1;white-space:nowrap}
  .foot{margin-top:26px}
  .navigation{margin-top:25px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="logo" aria-label="ABTI">ABTI<span style="color:#a15a21">.</span></div><div class="label">飲み会人格診断 · 16 TYPES</div></header>
<main class="shell" id="app"></main>
<footer class="foot">
<p>MBTIとは別のオリジナル・エンタメ診断です。科学的な性格検査やお酒の強さの判定ではありません。</p>
<p>ノンアルでも、自分のペースで。名前・回答は外部に送信されません。</p>
</footer>
<script>
const questions=[
{axis:0,q:'飲み会での会話、どちらが好き？',a:'いろいろな人と話して、交流を広げたい',b:'気の合う数人と、じっくり話したい'},
{axis:1,q:'ドリンクメニューを開いたら？',a:'知らない名前や、期間限定の一杯にひかれる',b:'まずは、いつものお気に入りを注文する'},
{axis:2,q:'飲み会で自然と気になるのは？',a:'注文や会計など、全体がスムーズに進むか',b:'話に入れていない人や、無理をしている人がいないか'},
{axis:3,q:'飲み会の予定、どう決めたい？',a:'お店や予算、帰る時間をある程度決めたい',b:'その日の気分や、集まった人に合わせたい'},
{axis:0,q:'初対面の人が多い席では？',a:'自分から声をかけて、いろいろな人を知りたい',b:'近くの人と話しながら、少しずつ打ち解けたい'},
{axis:1,q:'次の一杯を選ぶなら？',a:'さっきとは違う味を試してみたい',b:'気に入ったものを、もう一度楽しみたい'},
{axis:2,q:'グループの会話が落ち着いたときは？',a:'次の注文や、この後の予定を確認したくなる',b:'隣の人に、最近の様子を聞きたくなる'},
{axis:3,q:'「このあと、どうする？」と聞かれたら？',a:'帰りの時間や、決めていた予定をもとに考える',b:'今の気分で、帰るかもう少し楽しむか考える'},
{axis:0,q:'「今日は楽しかった」と感じるのは？',a:'たくさんの人と話して、新しいつながりができたとき',b:'気の合う相手と、深い話ができたとき'},
{axis:1,q:'次の飲み会のお店を選ぶなら？',a:'まだ行ったことのない、気になるお店',b:'味や雰囲気がわかっている、お気に入りのお店'},
{axis:2,q:'飲み会で、頼られやすいのは？',a:'予約や注文、会計などの取りまとめ',b:'相談相手や、場の空気をやわらげる役'},
{axis:3,q:'理想の飲み会の過ごし方は？',a:'見通しがあると、心置きなく楽しめる',b:'予定に縛られず、成り行きを楽しみたい'}
];
const axes=[['E','I','交流派','親密派'],['A','C','冒険派','定番派'],['T','F','段取り派','共感派'],['J','P','計画派','気分派']];
const types=[
['EATJ','乾杯プロデューサー','いい店、押さえてあります。','新しい楽しみを、段取りよく企画。','話題のお店も、珍しい一杯も、みんなで楽しめる形にして届ける企画上手。好奇心だけで突っ走らず、予約や予算まで押さえる頼もしさがあります。飲み会が成功するほど、裏ではあなたが動いているはず。','ときには幹事を任せて、招かれる側を楽しんでみて。',['企画','乾杯','盛り上げ']],
['EATP','はしご酒ナビゲーター','この近く、気になる店あるんだよね。','次の一軒も、その場でスマートに。','初めてのお店でも物おじせず、その場で次の楽しみを見つけるタイプ。自由に動きながら、混雑や移動の段取りもさりげなく考えています。あなたと飲む夜は、ちょっとした街歩き。','次のお店へ向かう前に、みんなの気分も聞けると名案がさらに輝きます。',['はしご酒','フットワーク','発見']],
['EAFJ','おもてなしソムリエ','これ、好きそうだと思って。','相手にぴったりの一杯を提案。','相手の好みを覚えていて、ぴったりの一杯やお店を提案できるタイプ。新しい体験を、自分だけでなく誰かと分かち合うことに喜びを感じます。「楽しかった」のひと言が何よりのご褒美。','全員を満足させようとして、自分の飲みたいものを忘れないで。',['おもてなし','ペアリング','気配り']],
['EAFP','酒場のフェスティバル','それ面白そう！ 一緒にどう？','出会いも新しい味も、みんなで満喫。','新しい味、新しい出会い、予定外の展開。そのすべてを楽しみに変える、場のムードメーカーです。初対面同士の壁をやわらげるのも得意で、気づけばテーブル全体がひとつの輪に。','誰かの「今日はここまで」も明るく受け止められると、さらに愛される存在に。',['出会い','新しい味','にぎやか']],
['ECTJ','宴会の司令塔','いつもの店、予約しておいたよ。','いつもの店で、安心の仕切り役。','おなじみのお店と安定の注文で、安心して楽しめる場をつくるタイプ。乾杯から会計まで流れがよく、周りはつい頼りたくなります。あなたのいる飲み会には、外しにくい心地よさがあります。','たまには予定にない話題や寄り道にも、少し余白を残してみて。',['仕切り','いつもの店','安心']],
['ECTP','酒場の現場監督','とりあえず座ろう。あとは何とかなる。','自由な流れを、さりげなく支える。','好きな一杯は決まっているけれど、飲み会の展開には柔軟。注文の追加や席の調整など、その場で必要なことを見つけて動けます。仕切りすぎず、困ったときには頼れる実務派。','自分だけ動いている夜は、周りにひと声かけて仕事を分けても大丈夫。',['柔軟対応','サポート','見守り']],
['ECFJ','みんなのホーム酒場','いつものメンバーで、ゆっくり飲もう。','いつもの仲間に、ほっとする時間を。','慣れたお店と好きな一杯、そして安心できる仲間。その組み合わせを大切にするタイプです。前に聞いた話を覚えていて、「あれ、どうなった？」と自然に声をかけられます。あなたがいると、久しぶりの集まりもすぐにいつもの空気に。','自分の近況も遠慮なく話して。',['仲間','いつもの店','安心感']],
['ECFP','愛され常連さん','いつもの一杯で、話の続きしよう。','好きな一杯と、気ままなおしゃべり。','お気に入りのドリンクを片手に、その日の会話をゆったり楽しむタイプ。決まった進行がなくても、人とのやりとりだけで心地よい時間をつくれます。親しみやすく、一緒にいる人を構えさせません。','楽しいとつい時間を忘れるので、帰る時間だけは先に見ておくと安心。',['常連','おしゃべり','マイペース']],
['IATJ','一杯の研究者','このお酒、ちょっと気になってた。','新しい味を、じっくり探究。','少人数で、新しい味をじっくり確かめるのが好きなタイプ。お店やメニューを調べる時間から、すでに楽しみが始まっています。派手に盛り上がるより、「これは好みだな」という発見がうれしい人。','詳しい解説の合間に相手の感想も聞くと、一杯の楽しみが広がります。',['探究','テイスティング','深掘り']],
['IATP','路地裏の探検家','この店、入ってみない？','気になる店へ、静かな冒険。','大勢でにぎわうより、一人や気の合う相手と未知のお店を開拓したいタイプ。細かく予定を固めず、店構えやメニューを見て行き先を決めます。静かな好奇心と、その場で判断する身軽さが魅力。','同行者にも選ぶ番を渡すと、自分では見つけなかった一軒に出会えるかも。',['探検','隠れた名店','ひとりでも']],
['IAFJ','ペアリングの詩人','今日の話には、この一杯が合いそう。','一杯と会話で、特別な夜をつくる。','相手と落ち着いて話せる場所を選び、少し特別なお酒を楽しむタイプ。味だけでなく、照明や音楽、その日の気分も含めて時間を味わいます。あなたとの飲み会は、あとから思い出したくなる夜に。','素敵な時間にしようと気負いすぎず、何気ない会話も楽しんで。',['ペアリング','深い会話','特別な時間']],
['IAFP','ほろ酔いストーリーテラー','この味、あのときの旅行を思い出す。','新しい味から、思い出話が広がる。','新しい一杯をきっかけに、思い出や本音がゆっくりあふれるタイプ。大勢の前では控えめでも、気を許した相手には意外な話を聞かせてくれます。話題が思わぬ方向に寄り道するのも魅力。','相手にも話の続きを渡せると、忘れられない夜を一緒につくれます。',['思い出話','共感','ほろ酔い']],
['ICTJ','晩酌の建築家','この組み合わせが、ちょうどいい。','自分に合う、心地よい定番を大切に。','好きなお酒、合うおつまみ、落ち着ける時間。自分にとって心地よい飲み方を把握しているタイプです。少人数の飲み会でもペースが安定していて、帰り際までスマート。','ときどき誰かのおすすめを取り入れると、新たなお気に入りが増えそう。',['定番','自分のペース','こだわり']],
['ICTP','マイペースの達人','一杯飲んでから、考えよう。','いつもの一杯を、その日の気分で。','いつものドリンクを選びつつ、過ごし方はその日の気分に任せるタイプ。会話が途切れても無理に埋めず、静かな時間も自然に楽しめます。必要なときには現実的に動けるので、付き合うほど頼もしさが伝わります。','希望をひと言伝えると、周りもあなたと過ごしやすくなります。',['気分','マイペース','リラックス']],
['ICFJ','隣席の守り人','無理してない？ お水、頼もうか。','近くの人の変化に、そっと気づく。','大きな声で場を仕切るより、近くの人をそっと気遣うタイプ。いつもの一杯を楽しみながら、表情や声の変化にも気づきます。安心して本音を話せる相手として、相談を持ちかけられることも。','聞き役ばかりで終わらないように、自分の話をする時間も大切に。',['気づかい','見守り','やさしさ']],
['ICFP','深夜の聞き上手','うん、それでどうなったの？','気の合う相手の話に、ゆっくり寄り添う。','好きな一杯をそばに置き、気の合う人との会話にゆっくり浸るタイプ。話を急いでまとめず、相手の気持ちに寄り添える人です。「もう少しだけ話したい」と思わせる、やわらかい空気が魅力。','相手に合わせすぎず、疲れたときは心地よいところでお開きに。',['傾聴','寄り添う','深夜の時間']]
];
let participantName='';
function cleanName(value){return Array.from(String(value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim()).slice(0,20).join('')}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let answers=Array(12).fill(null),step=0,currentResult=null,downloadUrl=null;
const app=document.getElementById('app');

const HUE={EA:28,EC:152,IA:205,IC:8};
function typeColor(code){
  const h=HUE[code.slice(0,2)];
  const s=code[2]==='T'?62:42;
  const l=code[3]==='J'?34:46;
  return{h,s,l,fg:`hsl(${h}, ${s}%, ${l}%)`,bg:`hsl(${h}, 22%, 90%)`};
}
function colorAt(i){return typeColor(types[i][0])}
function setAccent(code){
  const c=typeColor(code);
  document.documentElement.style.setProperty('--accent',c.fg);
  document.documentElement.style.setProperty('--accent-bg',c.bg);
}

function pictogramSvg(index){
  const c=colorAt(index);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="currentColor" aria-hidden="true"><rect width="120" height="120" fill="none"/>${PICTO[index]}</svg>`.replaceAll('currentColor',c.fg).replaceAll('var(--accent-bg)',c.bg);
}
function pictogramFrame(index,className,label){
  const c=colorAt(index);
  return `<div class="${className}" style="--accent:${c.fg};--accent-bg:${c.bg};background:${c.bg};color:${c.fg}" role="img" aria-label="${escapeHtml(label)}">${pictogramSvg(index)}</div>`;
}

function score(values){if(!Array.isArray(values)||values.length!==12||values.some(x=>x!==0&&x!==1))throw new Error('12問すべてに回答してください。');const counts=[0,0,0,0];values.forEach((v,i)=>{if(v===0)counts[questions[i].axis]++});const code=counts.map((n,i)=>axes[i][n>=2?0:1]).join('');return{code,counts,index:types.findIndex(t=>t[0]===code)}}
function focusHeading(){const h=app.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
function renderQuiz(focus=false){
  currentResult=null;
  const q=questions[step];
  setAccent('EATJ');
  app.innerHTML=`<div class="quiz-layout"><section class="intro"><p class="eyebrow">ALCOHOL BEHAVIOR TYPE INDICATOR</p><h1>あなたの<br>“飲み会人格”は？</h1><p>全12問・約2分。<br>気心の知れた人と飲むときの<br>自分に近い方を選んでください。</p><div class="name-field"><label for="participant-name">お名前・ニックネーム（任意）</label><input id="participant-name" type="text" maxlength="20" autocomplete="off" placeholder="例：サルサノア" value="${escapeHtml(participantName)}" aria-describedby="name-hint"><small class="name-hint" id="name-hint">20文字まで。結果と保存画像に表示します。</small></div>${pictogramFrame(0,'mini-art','乾杯のピクトグラム')}</section><section class="quiz" aria-label="診断の質問"><div class="question-meta"><span>QUESTION <strong>${String(step+1).padStart(2,'0')}</strong> / 12</span><span>${Math.round(step/12*100)}% 完了</span></div><div class="track" role="progressbar" aria-label="回答の進行状況" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${step}"><span style="width:${step/12*100}%"></span></div><h2>${q.q}</h2><div class="answers" role="group" aria-label="回答を選択"><button class="answer" data-choice="0" aria-pressed="${answers[step]===0}"><span class="letter">A</span><span>${q.a}</span></button><button class="answer" data-choice="1" aria-pressed="${answers[step]===1}"><span class="letter">B</span><span>${q.b}</span></button></div><div class="navigation"><button class="back" id="back" ${step===0?'disabled':''}>← 前の質問</button><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===11?'診断結果を見る':'次の質問へ →'}</button></div><p class="tip">どちらも当てはまる場合は、より普段に近い方を。</p></section></div>`;
  document.getElementById('participant-name').oninput=e=>{participantName=e.target.value};
  app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.choice)===answers[step])));document.getElementById('next').disabled=false});
  document.getElementById('back').onclick=()=>{if(step>0){step--;renderQuiz(true)}};
  document.getElementById('next').onclick=()=>{if(answers[step]===null)return;if(step<11){step++;renderQuiz(true)}else showResult()};
  if(focus)focusHeading();
}
function typePoster(){
  const swatches=[['EA','交流 × 冒険','琥珀'],['EC','交流 × 定番','深緑'],['IA','親密 × 冒険','藍'],['IC','親密 × 定番','葡萄酒']].map(([key,label,name])=>{
    const sample=key+'TJ';
    const c=typeColor(sample);
    return `<div class="color-swatch" style="background:${c.bg};color:${c.fg}"><b>${key}</b>${name}<br>${label}</div>`;
  }).join('');
  const cells=types.map((t,i)=>{
    const c=colorAt(i);
    return `<div class="type-cell" role="listitem" style="--cell-bg:${c.bg};--cell-fg:${c.fg}">${pictogramSvg(i)}<strong>${t[0]}</strong><span>${t[1]}</span></div>`;
  }).join('');
  return `<div class="color-swatches">${swatches}</div><div class="type-poster" role="list">${cells}</div><p class="color-rule">色は4つの軸から機械的に決まります。<br>色相＝交流/親密 × 冒険/定番　／　彩度＝段取り派は鮮やか、共感派はやわらかい　／　明度＝計画派は濃い、気分派は明るい。<br>E：交流派 / I：親密派　A：冒険派 / C：定番派<br>T：段取り派 / F：共感派　J：計画派 / P：気分派</p>`;
}
function showResult(){
  currentResult={...score(answers),name:cleanName(participantName)};
  const r=currentResult,t=types[r.index];
  setAccent(t[0]);
  app.innerHTML=`<section class="result"><div class="result-top"><p class="eyebrow">YOUR ABTI RESULT</p><span class="summary-note">12問の回答から判定</span></div><div class="result-layout"><div><article class="result-card">${pictogramFrame(r.index,'portrait',t[1]+'のピクトグラム')}<div class="card-copy">${r.name?`<p class="person-name">${escapeHtml(r.name)}さんの診断結果</p>`:''}<div class="type-code">${t[0]}</div><h2>${t[1]}</h2><p>${t[3]}</p></div></article><div class="actions"><button class="primary" id="save">結果画像を保存</button><button class="secondary" id="edit">回答を見直す</button></div><div class="status" id="save-status" role="status"></div><div id="save-preview"></div></div><div class="result-copy"><h3>「${t[2]}」</h3><div class="traits">${t[6].map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><p>${t[4]}</p><p><strong>もっと心地よい一杯に</strong><br>${t[5]}</p><div class="axes"><strong>あなたの回答バランス</strong>${axes.map((a,i)=>{const n=r.counts[i],pct=Math.round(n/3*100);return `<div class="axis"><div class="axis-labels"><span class="axis-left">${a[0]} ${a[2]} ${pct}%</span><span>${100-pct}% ${a[3]} ${a[1]}</span></div><div class="axis-track"><span style="width:${pct}%"></span></div></div>`}).join('')}<p class="summary-note">各軸3問の回答割合です。性格の強さや診断の確かさを示す数値ではありません。</p></div><button class="back" id="restart">もう一度診断する ↻</button></div></div><details><summary>16タイプの一覧を見る</summary>${typePoster()}</details></section>`;
  document.getElementById('save').onclick=saveResult;
  document.getElementById('edit').onclick=()=>{step=0;renderQuiz(true);window.scrollTo(0,0)};
  document.getElementById('restart').onclick=()=>{answers=Array(12).fill(null);step=0;renderQuiz(true);window.scrollTo(0,0)};
  focusHeading();
  window.scrollTo(0,0);
}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('画像を読み込めませんでした。もう一度お試しください。'));im.src=src})}
function wrap(ctx,text,x,y,maxWidth,lineHeight){let line='';for(const c of text){if(ctx.measureText(line+c).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=c}else line+=c}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}
function fillRound(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}
async function makeResultImage(result){
  const t=types[result.index],pal=typeColor(t[0]);
  const svg=pictogramSvg(result.index).replace('<svg ', '<svg width="640" height="640" ');
  const im=await loadImage('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
  await document.fonts.ready;
  const cv=document.createElement('canvas');
  cv.width=1080;cv.height=1560;
  const cx=cv.getContext('2d'),accent=pal.fg,ink='#122b43',muted='#5d6971',m=64,w=952;
  const jp='"Yu Gothic",Meiryo,sans-serif';
  cx.fillStyle='#fbf7ef';cx.fillRect(0,0,1080,1560);
  cx.fillStyle=ink;cx.font='bold 54px Georgia,serif';cx.fillText('ABTI.',m,78);
  cx.fillStyle='#a15a21';cx.font='22px '+jp;cx.fillText('飲み会人格診断',248,70);
  cx.fillStyle=muted;cx.font='22px '+jp;
  const resultLabel=result.name?result.name+'さんの診断結果':'あなたの飲み会人格';
  cx.fillText(resultLabel+'  ·  12問の回答から判定',m,118);

  const box=300,boxY=148,tx=m+box+36,tw=1080-m-tx;
  cx.fillStyle=pal.bg;fillRound(cx,m,boxY,box,box,28);
  cx.drawImage(im,m+36,boxY+36,228,228);

  cx.fillStyle=accent;cx.font='bold 70px Georgia,serif';cx.fillText(t[0],tx,boxY+74);
  cx.fillStyle=ink;cx.font='bold 32px '+jp;
  let y=wrap(cx,t[1],tx,boxY+124,tw,44);
  cx.fillStyle=accent;cx.font='25px '+jp;
  y=wrap(cx,'「'+t[2]+'」',tx,y+6,tw,38);
  cx.fillStyle=muted;cx.font='23px '+jp;
  y=wrap(cx,t[3],tx,y+4,tw,34);
  cx.fillStyle=accent;cx.font='21px '+jp;
  y=wrap(cx,t[6].map(s=>'#'+s).join('   '),tx,y+10,tw,30);

  y=Math.max(boxY+box,y)+44;
  cx.fillStyle=accent;cx.fillRect(m,y,w,6);
  y+=52;
  cx.fillStyle=ink;cx.font='28px '+jp;
  y=wrap(cx,t[4],m,y,w,46);
  y+=30;
  cx.fillStyle=accent;cx.font='bold 24px '+jp;
  cx.fillText('もっと心地よい一杯に',m,y);
  y+=42;
  cx.fillStyle=ink;cx.font='26px '+jp;
  y=wrap(cx,t[5],m,y,w,40);
  y+=36;
  cx.fillStyle=ink;cx.font='bold 24px '+jp;
  cx.fillText('あなたの回答バランス',m,y);
  y+=20;
  axes.forEach((a,i)=>{
    const n=result.counts[i],pct=Math.round(n/3*100);
    cx.font='22px '+jp;
    cx.fillStyle=n>=2?accent:muted;cx.textAlign='left';cx.fillText(`${a[0]} ${a[2]}  ${pct}%`,m,y+26);
    cx.fillStyle=n<2?accent:muted;cx.textAlign='right';cx.fillText(`${100-pct}%  ${a[3]} ${a[1]}`,m+w,y+26);
    cx.textAlign='left';
    y+=40;
    cx.fillStyle='#e4e8ec';fillRound(cx,m,y,w,12,6);
    if(pct>0){cx.fillStyle=accent;fillRound(cx,m,y,Math.max(14,w*pct/100),12,6)}
    y+=34;
  });
  cx.fillStyle=muted;cx.font='20px '+jp;
  y=wrap(cx,'各軸3問の回答割合です。性格の強さや診断の確かさを示す数値ではありません。',m,y+8,w,30);
  cx.fillText('MBTIとは別のオリジナル・エンタメ診断です。ノンアルでも、自分のペースで。',m,1512);
  return new Promise((resolve,reject)=>cv.toBlob(b=>b?resolve(b):reject(new Error('画像の作成に失敗しました。')),'image/png'));
}
async function saveResult(){
  const r=currentResult;if(!r)return;
  const btn=document.getElementById('save'),status=document.getElementById('save-status');
  btn.disabled=true;status.textContent='結果画像を作成しています…';
  try{
    const blob=await makeResultImage(r);
    if(currentResult!==r)return;
    if(downloadUrl)URL.revokeObjectURL(downloadUrl);
    downloadUrl=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=downloadUrl;a.download=`ABTI_${r.code}.png`;document.body.appendChild(a);a.click();a.remove();
    status.textContent='保存できない場合は、下の画像を長押しして保存してください。';
    const preview=document.getElementById('save-preview');preview.innerHTML='';
    const img=document.createElement('img');img.className='download-preview';img.src=downloadUrl;img.alt=r.code+' '+types[r.index][1]+'の診断結果画像';preview.appendChild(img);
  }catch(e){status.textContent=e.message||'画像を保存できませんでした。もう一度お試しください。'}
  finally{btn.disabled=false}
}
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'complete_abti_diagnosis',title:'ABTIを診断する',description:'画面にある12問に順番に回答して、診断結果を表示します。0は各質問のA、1はBです。',inputSchema:{type:'object',properties:{answers:{type:'array',items:{type:'integer',enum:[0,1]},minItems:12,maxItems:12}},required:['answers'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object')throw new Error('回答が必要です');const r=score(input.answers);answers=[...input.answers];showResult();return{type:r.code,name:types[r.index][1],counts:r.counts}}})).catch(()=>{})}catch(e){}}
renderQuiz();
</script>
